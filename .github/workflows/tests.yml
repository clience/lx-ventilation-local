name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s edge/tests -v
      - run: lua edge/tests/test_driver.lua
      - run: luac -p edge/driver/src/init.lua
      - run: docker compose --env-file .env.edge.example -f docker-compose.edge.yml config --quiet
